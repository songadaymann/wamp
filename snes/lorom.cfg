# ld65 linker config for SNESWAMP -- LoROM, 1 MiB (32 x 32 KiB banks), SlowROM.
#
# LoROM maps each 32 KiB ROM bank N at CPU address $NN:8000-$NN:FFFF.
# Every bank is its own MEMORY area so ld65 errors out if a bank overflows.
# To use another bank, just put code/data in segment "BANKn" (already declared
# below, optional).  To grow the ROM past 1 MiB: add ROMnn areas + BANKnn
# segments, and bump the ROM-size byte in src/header.s ($0A=1MiB, $0B=2MiB...).
#
# RAM layout:
#   $00:0000-$00:00FF  ZEROPAGE   direct page (D=0)
#   $00:0100-$00:01FF  (unused; keeps the emulation-mode stack page free)
#   $00:0200-$00:1EFF  BSS        low RAM, reachable from any bank with DB<$40
#   $00:1F00-$00:1FFF  stack      (S = $1FFF at reset)
#   $7E:2000-$7E:FFFF  BSS7E      high WRAM (long addressing or DB=$7E)
#   $7F:0000-$7F:FFFF  BSS7F

MEMORY {
    ZEROPAGE: start = $000000, size = $0100,  type = rw, file = "";
    LORAM:    start = $000200, size = $1D00,  type = rw, file = "";
    RAM7E:    start = $7E2000, size = $E000,  type = rw, file = "";
    RAM7F:    start = $7F0000, size = $10000, type = rw, file = "";

    ROM0:     start = $008000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM1:     start = $018000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM2:     start = $028000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM3:     start = $038000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM4:     start = $048000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM5:     start = $058000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM6:     start = $068000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM7:     start = $078000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM8:     start = $088000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM9:     start = $098000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM10:    start = $0A8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM11:    start = $0B8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM12:    start = $0C8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM13:    start = $0D8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM14:    start = $0E8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM15:    start = $0F8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM16:    start = $108000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM17:    start = $118000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM18:    start = $128000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM19:    start = $138000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM20:    start = $148000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM21:    start = $158000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM22:    start = $168000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM23:    start = $178000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM24:    start = $188000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM25:    start = $198000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM26:    start = $1A8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM27:    start = $1B8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM28:    start = $1C8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM29:    start = $1D8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM30:    start = $1E8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM31:    start = $1F8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZEROPAGE, type = zp;
    BSS:      load = LORAM,    type = bss, optional = yes;
    BSS7E:    load = RAM7E,    type = bss, optional = yes;
    BSS7F:    load = RAM7F,    type = bss, optional = yes;

    # Bank 0: all code that must be reachable from the vectors, plus near data.
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro, optional = yes;
    HEADER:   load = ROM0, type = ro, start = $00FFC0;
    VECTORS:  load = ROM0, type = ro, start = $00FFE0;

    # Data / far-code banks.
    BANK1:    load = ROM1,  type = ro, optional = yes;
    BANK2:    load = ROM2,  type = ro, optional = yes;
    BANK3:    load = ROM3,  type = ro, optional = yes;
    BANK4:    load = ROM4,  type = ro, optional = yes;
    BANK5:    load = ROM5,  type = ro, optional = yes;
    BANK6:    load = ROM6,  type = ro, optional = yes;
    BANK7:    load = ROM7,  type = ro, optional = yes;
    BANK8:    load = ROM8,  type = ro, optional = yes;
    BANK9:    load = ROM9,  type = ro, optional = yes;
    BANK10:   load = ROM10, type = ro, optional = yes;
    BANK11:   load = ROM11, type = ro, optional = yes;
    BANK12:   load = ROM12, type = ro, optional = yes;
    BANK13:   load = ROM13, type = ro, optional = yes;
    BANK14:   load = ROM14, type = ro, optional = yes;
    BANK15:   load = ROM15, type = ro, optional = yes;
    BANK16:   load = ROM16, type = ro, optional = yes;
    BANK17:   load = ROM17, type = ro, optional = yes;
    BANK18:   load = ROM18, type = ro, optional = yes;
    BANK19:   load = ROM19, type = ro, optional = yes;
    BANK20:   load = ROM20, type = ro, optional = yes;
    BANK21:   load = ROM21, type = ro, optional = yes;
    BANK22:   load = ROM22, type = ro, optional = yes;
    BANK23:   load = ROM23, type = ro, optional = yes;
    BANK24:   load = ROM24, type = ro, optional = yes;
    BANK25:   load = ROM25, type = ro, optional = yes;
    BANK26:   load = ROM26, type = ro, optional = yes;
    BANK27:   load = ROM27, type = ro, optional = yes;
    BANK28:   load = ROM28, type = ro, optional = yes;
    BANK29:   load = ROM29, type = ro, optional = yes;
    BANK30:   load = ROM30, type = ro, optional = yes;
    BANK31:   load = ROM31, type = ro, optional = yes;
}
