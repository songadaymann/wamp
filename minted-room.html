<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAMP Room Preview</title>
  </head>
  <body>
    <main>
      <header class="hero">
        <a class="home-link" href="/">WAMP</a>
        <h1 id="minted-room-title">Loading room...</h1>
        <p id="minted-room-summary">Loading room preview...</p>
        <div id="minted-room-meta" class="meta"></div>
        <a id="minted-room-play" class="play-room" hidden>Play Room</a>
        <p id="minted-room-owner" data-crypto aria-live="polite"></p>
      </header>

      <section aria-label="Room preview">
        <div id="minted-room-preview" class="preview-shell"></div>
        <p id="minted-room-preview-status" role="status">Loading preview…</p>
      </section>

      <section class="room-facts">
        <div>
          <h2>Room Details</h2>
          <dl id="minted-room-details"></dl>
        </div>
        <div>
          <h2>Attributes</h2>
          <ul id="minted-room-attributes"></ul>
        </div>
      </section>

      <section id="minted-room-error" class="error hidden" role="alert">
        <h2>Preview Unavailable</h2>
        <p id="minted-room-error-text"></p>
      </section>
    </main>
    <script type="module" src="/src/minted-room.ts"></script>
  </body>
</html>
