<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=/launch-admin.html#photo-review" />
    <title>Photo Review Moved | WAMP</title>
    <style>
      @font-face {
        font-family: 'EarlyGameBoy';
        src: url('/assets/fonts/early-gameboy.ttf') format('truetype');
        font-display: swap;
      }

      @font-face {
        font-family: 'HomeVideo';
        src: url('/assets/fonts/HomeVideo-Regular.ttf') format('truetype');
        font-display: swap;
      }

      :root {
        color: #18161c;
        background: #79ccde;
        font-family: 'HomeVideo', monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(90deg, transparent 31px, rgba(24, 22, 28, 0.12) 32px),
          linear-gradient(transparent 31px, rgba(24, 22, 28, 0.12) 32px),
          #79ccde;
        background-size: 32px 32px;
      }

      main {
        width: min(100%, 560px);
        padding: 32px;
        border: 4px solid #18161c;
        background: #fff3db;
        box-shadow: 10px 10px 0 #18161c;
      }

      h1 {
        margin: 0 0 16px;
        font: 18px/1.5 'EarlyGameBoy', monospace;
        text-transform: uppercase;
      }

      p {
        margin: 0 0 20px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 12px 16px;
        border: 3px solid #18161c;
        color: #18161c;
        background: #fcea7c;
        box-shadow: 4px 4px 0 #18161c;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
    <script>
      window.location.replace('/launch-admin.html#photo-review');
    </script>
  </head>
  <body>
    <main>
      <h1>Photo Review Moved</h1>
      <p>Photo approvals now live inside the unified Launch Admin control room.</p>
      <a href="/launch-admin.html#photo-review">Open Photo Review</a>
    </main>

</html>
