<!DOCTYPE html>
<!--
    This is a template for sharing your wamp.land Room to itch.io
    All this does is create an iframe so WAMP loads in your itch.io page
    After setting your URL and making any other changes you want, upload this index file as your only game file and set the "Kind of Project" to HTML.
    Set up the "Embed" options further down on the upload page, and set the frame size.
    AI Disclosure: WAMP has been made with "vibe coding", so you should check "Yes" to AI disclosure, and check the "Code" box. All artwork in WAMP is lovingly hand crafted.
    Here's an example of a WAMP Room posted to itch.io using 1000px x 1000px viewport settings: https://kamisawze.itch.io/wamp-tutorial
    Visit our Discord if you need help: https://discord.com/invite/bEpc3XsnvV
-->


<html>
<head>
    <meta charset="utf-8">
    <title>Your Title Here</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="https://wamp.land/r/0/0" allowfullscreen></iframe> <!-- Change the numbers in the URL to match your LAND coordinates. Make sure to include a minus sign for negative coordinates like https://wamp.land/r/0/-5 -->
</body>
</html>
