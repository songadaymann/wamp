name: Production world map health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check_world_tile_availability.mjs
