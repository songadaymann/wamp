name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run styles:check
      - run: npm run test
      - run: npm run typecheck
      - run: npm run world-tiles:types:check
      - run: npm run build
      - run: npm run size:check
      - run: npm run assets:png:check
      - run: npm run assets:trees:check
      - name: Check immutable world map asset compatibility
        run: npx --yes tsx scripts/world_tile_asset_contract_check.ts
      - run: npm run smoke:dom-contract
      - run: npm run smoke:worker-safety

  mobile-smoke:
    # Phone and tablet layouts against a production build, with recorded API responses (F089).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browsers and their system packages come preinstalled, so no apt mirror is involved.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The container runs as root over a workspace the runner owns; the build reads git.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --only-shell chromium webkit
      - run: npm run smoke:mobile:ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke
          path: output/web-game/mobile-smoke-ci
          retention-days: 7

