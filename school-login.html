<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="ai-api-base" content="https://api.wamp.land" />
    <title>Classroom Login</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0d12;
        --panel: #131821;
        --line: rgba(183, 202, 232, 0.24);
        --text: #f5f7fb;
        --muted: #a8b3c7;
        --accent: #6ec5ff;
        --danger: #ff7676;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      main {
        width: min(440px, calc(100vw - 28px));
        display: grid;
        gap: 14px;
      }

      .panel {
        display: grid;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 18px;
      }

      h1 {
        margin: 0;
        font-family: "IBM Plex Mono", "Fira Code", monospace;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      input,
      button {
        min-height: 44px;
        border-radius: 8px;
        font: inherit;
      }

      input {
        border: 1px solid var(--line);
        background: #080b10;
        color: var(--text);
        padding: 10px 12px;
      }

      button {
        border: 1px solid rgba(110, 197, 255, 0.36);
        background: rgba(110, 197, 255, 0.14);
        color: var(--text);
        padding: 10px 12px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .status {
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div>
          <h1>Classroom Login</h1>
          <p id="classroom-name">Loading classroom...</p>
        </div>
        <form id="login-form" class="panel" style="padding: 0; border: 0; background: transparent;">
          <label>
            Username
            <input id="username-input" type="text" autocomplete="username" />
          </label>
          <label>
            Password
            <input id="password-input" type="password" autocomplete="current-password" />
          </label>
          <div id="reset-fields" class="hidden">
            <label>
              New password
              <input id="new-password-input" type="password" autocomplete="new-password" />
            </label>
            <label>
              Confirm new password
              <input id="confirm-password-input" type="password" autocomplete="new-password" />
            </label>
          </div>
          <button id="submit-button" type="submit">Sign In</button>
        </form>
        <div id="status" class="status"></div>
      </section>
    </main>
    <script type="module" src="/src/school-login.ts"></script>
  </body>
</html>
